[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading"
version = "0.1.0"
description = "A modular framework for algorithmic trading strategies, backtesting, and portfolio management"
readme = "README.md"
authors = [{name = "Kilo Autonomous Agent"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pandas-stubs>=3.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0",
    "scikit-optimize>=0.10.0",
]
bayesian = [
    "scikit-optimize>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_trading*"]

[tool.pytest.ini_options]
testpaths = ["tests", "quant_trading"]
addopts = "--doctest-modules -m \"not slow\""
markers = ["slow: marks tests as slow (smoke/subprocess); deselect with -m \"not slow\""]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:.*evaluated at point.*before.*:UserWarning:skopt.*",
    "ignore:.*duplicate.*:UserWarning",
    "ignore:.*Pandas4Warning.*:Warning",
    "ignore:.*sort_index.*:FutureWarning",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["quant_trading"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]