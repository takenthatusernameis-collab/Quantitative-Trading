name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check quant_trading tests

      - name: Black
        run: python -m black --check quant_trading tests

      - name: Mypy
        run: python -m mypy quant_trading

      - name: Pytest
        run: python -m pytest -q
