name: CI

on:
  push:
    branches:
      - main
    paths:
      - "quant_trading/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "quant_trading/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Coverage gate (must be 100%)
        shell: bash
        run: |
          set -euo pipefail
          MPLBACKEND=Agg python -m pytest -q -p no:cacheprovider \
            --cov --cov-report=term -m "not slow and not network" 2>&1 | tee coverage.log
          total_row="$(grep -E '^TOTAL[[:space:]]' coverage.log | tail -n 1)"
          if [ -z "$total_row" ]; then
            echo "::error::Could not find a TOTAL row in the coverage report."
            exit 1
          fi
          read -r _ stmts miss branches partial pct <<< "$total_row"
          if [ "$miss" != "0" ] || [ "$partial" != "0" ]; then
            echo "::error::Coverage is not complete: missed_stmts=${miss} partial_branches=${partial} (${pct})."
            exit 1
          fi
          echo "Coverage gate passed: missed_stmts=${miss} partial_branches=${partial} (${pct})."

      - name: Formatting (black)
        run: python -m black --check tests/ quant_trading/ examples/

      - name: Lint (ruff)
        run: python -m ruff check tests/ quant_trading/ examples/

      - name: Type check (mypy)
        run: python -m mypy tests/ quant_trading/ examples/
