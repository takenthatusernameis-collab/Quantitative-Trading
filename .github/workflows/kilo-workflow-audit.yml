name: Kilo workflow validation

on:
  push:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/scripts/kilo-controller.sh"
  pull_request:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/scripts/kilo-controller.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate Kilo workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml
      - name: Independent YAML parse
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/main.yml"); puts "Kilo workflow YAML: OK"'
      - name: Validate extracted Kilo controller Bash syntax
        shell: bash
        run: bash -n .github/scripts/kilo-controller.sh

      - name: Guard customizable sessions and cutoff-bounded retries
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          workflow=.github/workflows/main.yml
          bash -n "$controller"
          grep -Fq 'KILO_INPUT_AGENTS' "$controller"
          grep -Fq 'SESSION_LIMIT_POLICY="$agents"' "$controller"
          grep -Fq 'KILO_INPUT_AGENTS:' "$workflow"
          grep -Fq 'type: number' "$workflow"
          grep -Fq 'default: "1000"' "$workflow"
          grep -Fq 'agent_index' "$controller"
          grep -Fq '355-minute cutoff' "$controller"
          if grep -Eq 'agents.{0,12}-gt[[:space:]]+1000|MAX_TRANSIENT_ATTEMPTS|KILO_MAX_SESSIONS|session_limit_reached|inputs[.]sessions' "$controller" "$workflow"; then
            echo "::error::An arbitrary session maximum or capped retry policy was reintroduced."
            exit 1
          fi
          echo "Customizable session target with count-unbounded retries and 355-minute hard cutoff: OK"
