name: Kilo workflow validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate GitHub Actions workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml
      - name: Independent YAML parse
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/main.yml"); puts "Ruby YAML parser: OK"'
      - name: Validate embedded Kilo shell syntax
        shell: bash
        run: |
          ruby -ryaml -e 'doc = YAML.load_file(".github/workflows/main.yml"); script = doc.fetch("jobs").fetch("kilo").fetch("steps").find { |step| step["run"] }.fetch("run"); script = script.gsub(/\$\{\{.*?\}\}/, "2"); File.write(File.join(ENV.fetch("RUNNER_TEMP"), "kilo-main.sh"), script)'
          bash -n "$RUNNER_TEMP/kilo-main.sh"
