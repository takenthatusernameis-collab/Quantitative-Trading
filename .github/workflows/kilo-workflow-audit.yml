name: Kilo workflow validation

on:
  push:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/scripts/kilo-controller.sh"
  pull_request:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/scripts/kilo-controller.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate Kilo workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml
      - name: Independent YAML parse
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/main.yml"); puts "Kilo workflow YAML: OK"'
      - name: Validate extracted Kilo controller Bash syntax
        shell: bash
        run: bash -n .github/scripts/kilo-controller.sh

      - name: Guard recoverable Kilo checkpoint persistence
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          grep -Fq 'git bundle create' "$controller"
          grep -Fq 'git bundle verify' "$controller"
          grep -Fq 'refs/heads/kilo-recovery/' "$controller"
          grep -Fq 'conflict_signature=' "$controller"
          grep -Fq 'Reached three rebase conflicts' "$controller"
          grep -Fq 'same checkpoint conflicted with the same remote head again' "$controller"
          grep -Fq 'rebase_abort_succeeded=' "$controller"
          echo "Recoverable checkpoint, verified backup, and repeated-conflict guard: OK"
      - name: Guard cutoff-bounded unlimited session policy
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          workflow=.github/workflows/main.yml
          bash -n "$controller"
          grep -Fq 'KILO_INPUT_AGENTS' "$controller"
          grep -Fq 'agents:' "$workflow"
          grep -Fq 'KILO_INPUT_AGENTS:' "$workflow"
          grep -Fq 'default: "1000"' "$workflow"
          grep -Fq "AGENT_SESSION_TARGET=\"\$configured_agent_target\"" "$controller"
          grep -Fq "SESSION_LIMIT_POLICY=\"\$AGENT_SESSION_TARGET\"" "$controller"
          grep -Fq 'Configured session target reached' "$controller"
          grep -Fq 'transient retries and corrective invocations remain count-unbounded' "$controller"
          grep -Fq 'transient retries and corrective invocations remained count-unbounded' "$controller"
          grep -Fq '355-minute cutoff' "$controller"
          grep -Fq 'exactly two validation sessions' "$controller"
          if grep -Eq 'MAX_TRANSIENT_ATTEMPTS|KILO_MAX_SESSIONS|session_limit_reached|This is the single bounded corrective pass|Configured session limit of' "$controller"; then
            echo "::error::A fixed transient-retry or corrective-attempt count cap remains."
            exit 1
          fi
          echo "Customizable sequential sessions, unbounded retries/correctives, and cutoff guardrails: OK"
