name: Kilo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kilo-repository
  cancel-in-progress: false

jobs:
  kilo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - id: kilo_controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KILO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/kilo-controller.sh
      - name: Summarize controller outcome
        if: always()
        continue-on-error: true
        env:
          CONTROLLER_OUTCOME: ${{ steps.kilo_controller.outcome }}
          PROJECT_PROGRESS: ${{ steps.kilo_controller.outputs.project_progress }}
          FAILED_SESSIONS: ${{ steps.kilo_controller.outputs.failed_sessions }}
          IDLE_TIMEOUT_RETRIES: ${{ steps.kilo_controller.outputs.idle_timeout_retries }}
        shell: bash
        run: |
          {
            echo "## Kilo controller health"
            echo "- Controller step outcome: \`$CONTROLLER_OUTCOME\`"
            echo "- Session policy: no session-count cap during normal activations; continue sequential work until the global 355-minute hard cutoff. The explicit one-shot validation marker remains capped at two sessions."
            echo "- Verified meaningful project progress: ${PROJECT_PROGRESS:-unknown}"
            echo "- Failed Kilo sessions: ${FAILED_SESSIONS:-unknown}"
            echo "- Upstream idle/network retries: ${IDLE_TIMEOUT_RETRIES:-unknown}"
            if [ "$CONTROLLER_OUTCOME" = "success" ] && [ "$PROJECT_PROGRESS" = "1" ]; then
              echo "- Controller completed with verified, durable project progress."
            else
              echo "- No verified project progress was confirmed in this activation. The run is marked failed so the next scheduled activation can recover."
              echo "::warning::Do not treat a successful cleanup or marker commit as task completion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kilo failure transcripts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kilo-failure-transcripts-${{ github.run_id }}
          path: ${{ runner.temp }}/kilo-failure-logs/
          if-no-files-found: ignore
          retention-days: 7

