name: Tests

on:
  push:
    paths:
      - "quant_trading/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "quant_trading/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev, bayesian, and reporting extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bayesian,reporting]"

      - name: Lint (ruff)
        shell: bash
        run: ruff check .

      - name: Format check (black)
        shell: bash
        run: black --check .

      - name: Type check (mypy)
        shell: bash
        run: mypy quant_trading examples

      - name: Run default test suite (unit + doctests, excludes slow/network)
        shell: bash
        run: pytest -q

      - name: Run slow test suite (smoke/subprocess, excludes network)
        shell: bash
        run: pytest -m "slow and not network" -q